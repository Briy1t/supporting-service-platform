<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto — Supporting</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container navbar-inner">
            <div class="logo">SUPPORTING 🫴</div>

            <nav class="navbar-center">
                <a href="index.html#servicios">Servicios</a>
                <a href="monitorizacion.html">Monitorización</a>
                <a href="index.html#precios">Precios</a>
                <a href="contacto.html">Contacto</a>
            </nav>

            <div class="navbar-right">
                <a class="btn-nav" href="login.html">Ingresar</a>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- HERO CONTACTO -->
        <section class="hero">
            <div class="hero-content">
                <h1>Contactanos</h1>
                <p>Estamos aquí para ayudarte. </p>
                <p>Completa el formulario y nos pondremos en contacto contigo.</p>

                <p style="margin-top:20px; font-size:14px; color:#b4c7d7;">
                    Tipo de solicitud detectado:
                    <strong style="color:#39dfc2;">
                        <!-- Mostrar tipo de solicitud -->
                        <script>
                            const params = new URLSearchParams(window.location.search);
                            const tipo = params.get("tipo") || "contacto_general";
                            document.write(tipo.replace(/_/g, " "));
                        </script>
                    </strong>
                </p>
            </div>

            <div class="hero-image">
                <img src="assets/img/contact.png" alt="Contacto Supporting">
            </div>
        </section>

        <!-- FORMULARIO -->
        <section class="section">
            <h2 class="section-title">Formulario de Contacto</h2>

            <form action="procesar_formulario.php" method="POST" class="card" style="max-width:600px; margin:auto;">

                <!-- Campo oculto para clasificar la solicitud -->
                <input type="hidden" name="tipo_solicitud" id="tipo_solicitud">

                <script>
                    const params2 = new URLSearchParams(window.location.search);
                    const tipo2 = params2.get("tipo") || "contacto_general";
                    document.getElementById("tipo_solicitud").value = tipo2;
                </script>

                <label>Nombre</label>
                <input type="text" name="nombre" required style="margin-bottom:20px; padding:10px; width:100%;">

                <label>Email</label>
                <input type="email" name="email" required style="margin-bottom:20px; padding:10px; width:100%;">

                <label>Mensaje</label>
                <textarea name="mensaje" rows="5" required style="margin-bottom:20px; padding:10px; width:100%;"></textarea>

                <button type="submit" class="btn-primary">Enviar Solicitud</button>
            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Supporting — IT Support, Hardening & Monitoring</p>
    </footer>

</body>
</html>
